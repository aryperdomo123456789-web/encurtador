# Stack de produção completa:
#   - db      : MariaDB persistente (motor Shlink + painel)
#   - shlink  : motor de encurtamento (isolado, sem rota administrativa exposta)
#   - panel   : painel Laravel (multi-tenant, admin de clientes)
#   - caddy   : proxy reverso com TLS On-Demand (Let's Encrypt)
#
# Uso:
#   cp deploy/.env.example deploy/.env  # ajuste os segredos
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env up -d
#
# Nunca comitar o arquivo `.env` real.

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shlink:
    image: shlinkio/shlink:stable
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEFAULT_DOMAIN: ${SHLINK_DEFAULT_DOMAIN}
      IS_HTTPS_ENABLED: "true"
      GEOLITE_LICENSE_KEY: ${GEOLITE_LICENSE_KEY}
      DB_DRIVER: maria
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      INITIAL_API_KEY: ${INITIAL_API_KEY}
      TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8
      TIMEZONE: UTC

  panel:
    build:
      context: ..
      dockerfile: deploy/panel.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      shlink:
        condition: service_started
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://${PANEL_HOST}
      PANEL_HOST: ${PANEL_HOST}
      PANEL_CUSTOM_DOMAIN_DNS_TARGET: ${PANEL_CUSTOM_DOMAIN_DNS_TARGET}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SHLINK_BASE_URL: http://shlink:8080
      SHLINK_API_KEY: ${INITIAL_API_KEY}
      SHLINK_DEFAULT_DOMAIN: ${SHLINK_DEFAULT_DOMAIN}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - panel
      - shlink
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PANEL_HOST: ${PANEL_HOST}
      SHLINK_DEFAULT_DOMAIN: ${SHLINK_DEFAULT_DOMAIN}
      TLS_CONTACT_EMAIL: ${TLS_CONTACT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
