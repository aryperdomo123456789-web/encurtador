services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shlink:
    image: shlinkio/shlink:stable
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEFAULT_DOMAIN: ${SHLINK_DEFAULT_DOMAIN}
      IS_HTTPS_ENABLED: "true"
      GEOLITE_LICENSE_KEY: ${GEOLITE_LICENSE_KEY}
      DB_DRIVER: maria
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      INITIAL_API_KEY: ${INITIAL_API_KEY}
      TRUSTED_PROXIES: 1
      TIMEZONE: UTC
    expose:
      - "8080"

  panel:
    image: composer:2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app/panel/laravel
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      PANEL_HOST: ${PANEL_HOST}
      PANEL_CUSTOM_DOMAIN_DNS_TARGET: ${PANEL_CUSTOM_DOMAIN_DNS_TARGET}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SHLINK_BASE_URL: ${SHLINK_BASE_URL}
      SHLINK_API_KEY: ${SHLINK_API_KEY}
      SHLINK_DEFAULT_DOMAIN: ${SHLINK_DEFAULT_DOMAIN}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_STACK: ${LOG_STACK}
      LOG_STDERR_FORMATTER: ${LOG_STDERR_FORMATTER}
    volumes:
      - ..:/app
      - panel_vendor:/app/panel/laravel/vendor
      - panel_storage:/app/panel/laravel/storage
      - panel_bootstrap_cache:/app/panel/laravel/bootstrap/cache
    command: >
      sh -lc "
      composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader &&
      php artisan config:clear &&
      php artisan route:clear &&
      php artisan view:clear &&
      php artisan serve --host=0.0.0.0 --port=8000
      "
    expose:
      - "8000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - panel
      - shlink
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  panel_vendor:
  panel_storage:
  panel_bootstrap_cache:
  caddy_data:
  caddy_config:
